<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada | DAVLI</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#01070e">
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 50% 35%, #0b2350 0%, #01070e 60%);
      color: #e8ecf3; font-family: "Inter", system-ui, sans-serif; text-align: center;
    }
    .code { font-family: "Michroma", sans-serif; font-size: clamp(4rem, 18vw, 8rem); line-height: 1;
      background: linear-gradient(90deg, #3d8bff, #8fb8ff 60%, #ff2b2b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-family: "Michroma", sans-serif; font-weight: 400; font-size: clamp(1.1rem, 3vw, 1.5rem); margin: 1.2rem 0 .6rem; }
    p { color: #93a1b8; margin-bottom: 2rem; }
    a { display: inline-block; padding: .9rem 1.6rem; border-radius: 999px; color: #fff; font-weight: 600; text-decoration: none;
      background: linear-gradient(135deg, #1f6bff, #0d47c9); box-shadow: 0 6px 24px rgba(31,107,255,.35); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Esta página se nos escapó</h1>
    <p>La dirección que buscas no existe o cambió de lugar.</p>
    <a id="home" href="/">Volver al inicio</a>
  </main>
  <script>
    // En GitHub Pages el sitio vive en /<repositorio>/; con dominio propio, en la raíz.
    if (location.hostname.endsWith("github.io")) {
      document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
    }
  </script>
</body>
</html>
